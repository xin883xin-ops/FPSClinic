<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KitLab Dash 的應用商店：收錄其他開發者的優秀 PWA 網頁應用，按安裝就放進你的 Dash。">
<meta property="og:title" content="KitLab Dash 應用商店">
<meta property="og:description" content="收錄其他開發者的優秀網頁應用，免下載，打開瀏覽器就能用。">
<meta name="theme-color" content="#0A0D12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1620'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2.5' fill='%235FD3BC'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2.5' fill='white'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2.5' fill='white'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2.5' fill='white' fill-opacity='.4'/%3E%3C/svg%3E">
<script src="../../sync.js" defer></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/app-apple-touch.png">
<!--
  站長筆記：KitLab Dash 應用商店（第一部分），放在 launcher/store/。
  按「安裝」會把應用寫進 localStorage 的 kitlab-dash-installed，Dash（launcher/index.html）讀這份清單顯示在站點格。
  sites.json 裡的官方站點會自動標成「Dash 內建」，不能重複安裝。
  目錄從 /api/v1/catalog 讀取（Cloudflare Worker + D1，程式在 worker/）；連不上時改讀同資料夾的 catalog.json 備份。
  欄位：i=編號 n=名稱 u=官方網址 c=分類 d=中文介紹 e=英文原文 f=1 精選 o=1 離線可用 p=開發者 s=來源(pd=pwa.directory, pm=pwamart) l=目錄頁 t=標籤
  上方輪播是 HERO 陣列（沿用 launcher/sites.json 的介紹文字與圖示）。
  其他應用的圖示由 Google 圖示服務即時載入，載不到時顯示分類色的字母圖塊。
-->
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>KitLab Dash 應用商店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: KitLab 商店深色店面 — 黏性頂欄 + 分類列，首頁是大橫幅輪播接一排排可拖曳的應用卡，分類／搜尋切成網格，點卡片開右側（手機為底部）介紹面板 */
:root{
  --bg:#0A0D12; --bg2:#10151C; --card:#141A22; --card2:#1C232D; --line:#232B36;
  --ink:#F2F4F7; --muted:#8E98A8; --dim:#6B7585;
  --teal:#F2F4F7; --teal-deep:#D5DAE1; --teal-bright:#7CF0B4; --amber:#F2C14E;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --disp:"Bricolage Grotesque","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--teal-bright)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal-bright);outline-offset:3px;border-radius:8px}
.wrap{max-width:1280px;margin-inline:auto;padding-left:var(--gut);padding-right:var(--gutr)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,13,18,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:32px;height:32px;display:block}
.brand b{font-family:var(--disp);font-size:1.2rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:normal;font-weight:700;font-size:.78rem;color:var(--bg);background:var(--teal-bright);padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:2px;letter-spacing:.02em}
.q{flex:1;display:flex;align-items:center;gap:8px;max-width:520px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;min-width:0}
.q:focus-within{border-color:var(--teal-bright)}
.q svg{width:18px;height:18px;flex:none;color:var(--muted)}
.q input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 .98rem var(--font);padding:10px 0;outline:0}
.q input::placeholder{color:var(--dim)}
.q .clear{border:0;background:var(--card2);width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);flex:none}
.back{flex:none;font-size:.9rem;font-weight:700;text-decoration:none;color:var(--ink);padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;white-space:nowrap}
.back:hover{border-color:var(--teal-bright);color:var(--teal-bright)}

/* ---------- category nav ---------- */
.cats{border-top:1px solid rgba(36,53,65,.6)}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.cats .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;font-size:.9rem;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink);border-color:#36505f}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip .n{font-family:var(--mono);font-size:.72rem;opacity:.7}
.chip i{width:8px;height:8px;border-radius:2px;display:block;flex:none}

/* ---------- hero ---------- */
.hero{padding-block:22px 6px}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.slides{display:flex;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.slide{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:24px;padding:42px 48px 54px;position:relative;isolation:isolate;min-height:340px}
.slide::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 120% at 82% 50%,color-mix(in srgb,var(--c) 42%,transparent) 0%,transparent 62%),linear-gradient(115deg,var(--bg2) 30%,color-mix(in srgb,var(--c) 16%,var(--bg2)) 100%)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:12px}
.eyebrow b{color:var(--bg);background:var(--teal-bright);padding:1px 8px;border-radius:4px;letter-spacing:.02em}
.slide h2{font-family:var(--disp);font-size:clamp(2.2rem,5vw,3.8rem);font-weight:700;letter-spacing:-.035em;line-height:1}
.slide .why{color:#C9CFD8;font-size:1.04rem;margin-top:12px;max-width:34em}
.slide .by{color:var(--muted);font-size:.86rem;margin-top:10px}
.slide .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.art{justify-self:center;position:relative;width:min(220px,100%);aspect-ratio:1}
.art img{width:100%;height:100%;object-fit:contain;border-radius:22%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));position:relative}
.art::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,transparent);filter:blur(30px)}
.dots{position:absolute;left:48px;bottom:20px;display:flex;gap:8px}
.dots button{width:26px;height:4px;border-radius:2px;border:0;background:rgba(234,241,244,.25);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--ink);width:44px}
.arrows{position:absolute;right:20px;bottom:16px;display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(234,241,244,.25);background:rgba(11,20,26,.5);cursor:pointer;display:grid;place-items:center}
.arrows button:hover{background:var(--ink);color:var(--bg)}
.arrows svg{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;line-height:1.2;padding:12px 22px;border-radius:999px;border:2px solid var(--teal);background:var(--teal);color:var(--bg);cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--teal-deep);border-color:var(--teal-deep);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:rgba(234,241,244,.35);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink);background:rgba(234,241,244,.06)}
.btn svg{width:16px;height:16px}

/* ---------- stats strip ---------- */
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;color:var(--muted);font-size:.88rem;padding-block:14px 4px}
.strip b{font-family:var(--mono);color:var(--ink);font-size:1.05rem;margin-right:4px}
.strip .part{margin-left:auto;font-size:.8rem;border:1px dashed #36505f;padding:2px 10px;border-radius:999px}

/* ---------- sections & rails ---------- */
main{padding-bottom:40px}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:1.32rem;font-weight:900}
.sec-h .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.sec-h .more{margin-left:auto;flex:none;border:0;background:none;color:var(--teal-bright);font-weight:700;font-size:.9rem;cursor:pointer;padding:6px 2px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sec-h .more:hover{text-decoration:underline}
.sec-h .ctl{display:flex;gap:6px;flex:none}
.sec-h .more svg{width:16px;height:16px}
.sec-h .ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.sec-h .ctl button:hover{border-color:var(--teal-bright)}
.sec-h .ctl svg{width:16px;height:16px}
.bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*14px)/4);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px;overscroll-behavior-x:contain;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.rail.dragging{scroll-snap-type:none;cursor:grabbing}
.rail.dragging .card{pointer-events:none}
.rail.tall{grid-template-rows:repeat(2,auto)}

/* ---------- card ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:12px;row-gap:8px;min-width:0;transition:border-color .15s,transform .15s,background .15s}
.card:hover{border-color:#3a5668;background:#182833;transform:translateY(-2px)}
.card .hit{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;border-radius:16px;z-index:1}
.card .nm{grid-column:2;min-width:0;align-self:center}
.card h3{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cat{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px}
.card .cat i{width:7px;height:7px;border-radius:2px}
.card .desc{grid-column:1/-1;font-size:.86rem;color:#BFCDD4;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.66em}
.card .foot{grid-column:1/-1;display:flex;align-items:center;gap:6px;min-width:0}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.pick{background:rgba(242,193,78,.14);color:var(--amber)}
.badge.off{background:rgba(95,211,188,.12);color:var(--teal-bright)}
.get{margin-left:auto;position:relative;z-index:2;flex:none;text-decoration:none;font-weight:700;font-size:.82rem;color:var(--ink);background:var(--card2);border:1px solid #2e4452;padding:5px 14px;border-radius:999px;display:flex;align-items:center;gap:4px}
.get:hover{background:var(--teal-bright);border-color:var(--teal-bright);color:var(--bg)}
.get svg{width:12px;height:12px}

.get.inst{background:var(--teal-bright);border-color:var(--teal-bright);color:var(--bg)}
.get.done{background:transparent;border-color:#33404f;color:var(--teal-bright)}
.get.done:hover{background:var(--card2);color:var(--ink);border-color:#4a5868}
.get.builtin{background:transparent;border-color:transparent;color:var(--muted);cursor:default}
.btn.danger{background:transparent;border-color:#3a4452;color:var(--ink)}
.btn.danger:hover{border-color:#ff8a8a;color:#ffb3b3;background:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;display:flex;align-items:center;gap:14px;background:#1E2530;border:1px solid #2d3644;border-radius:999px;padding:10px 10px 10px 20px;font-size:.92rem;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast b{width:8px;height:8px;border-radius:50%;background:var(--teal-bright);flex:none}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast a{flex:none;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;padding:7px 16px;border-radius:999px;font-size:.85rem}
.mycount{display:inline-flex;align-items:center;gap:6px}
.mycount b{font-family:var(--mono);background:var(--teal-bright);color:var(--bg);border-radius:999px;padding:0 7px;font-size:.75rem;line-height:1.5}
/* app icon */
.ic{grid-row:1;width:56px;height:56px;border-radius:14px;position:relative;overflow:hidden;flex:none;background:var(--mg);display:grid;place-items:center}
.ic .mono{font-weight:900;font-size:1.45rem;color:rgba(255,255,255,.95);letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;opacity:0;transition:opacity .2s}
.ic.has img{opacity:1}
.ic.has .mono{visibility:hidden}
.ic.small img{inset:14px;width:auto;height:auto;background:transparent}
.ic.small{background:#F3F6F7}
.ic.xl{width:88px;height:88px;border-radius:22px}
.ic.xl .mono{font-size:2.3rem}
.ic.xl.small img{inset:22px}

/* ---------- grid view ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.view-h{padding-top:26px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.view-h h1{font-family:var(--disp);font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
.view-h .sub{color:var(--muted);font-size:.92rem;width:100%}
.sort{margin-left:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.sort button{border:0;background:transparent;color:var(--muted);font-size:.84rem;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--card2);color:var(--ink);font-weight:700}
.loadmore{display:flex;justify-content:center;margin-top:22px}
.empty{padding:50px 0;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

.dash{margin-top:34px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--line);border-radius:18px;padding:18px 22px;background:linear-gradient(110deg,var(--bg2),#12302c)}
.dash .dk{display:grid;grid-template-columns:repeat(3,12px);gap:4px;flex:none}
.dash .dk i{width:12px;height:12px;border-radius:3px;background:var(--teal-bright)}
.dash .dk i:nth-child(even){background:#fff;opacity:.85}
.dash div.t{flex:1;min-width:200px}
.dash b{display:block;font-size:1.05rem}
.dash span{color:var(--muted);font-size:.88rem}
/* ---------- note ---------- */
.note{margin-top:40px;border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;background:var(--bg2)}
.note h3{font-size:.98rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.note h3 svg{width:18px;height:18px;color:var(--teal-bright);flex:none}
.note p{color:var(--muted);font-size:.88rem}
footer{border-top:1px solid var(--line);margin-top:30px}
footer .wrap{padding-block:24px 40px;color:var(--dim);font-size:.82rem;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{color:var(--muted)}

/* ---------- detail panel ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(3,8,11,.66);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:91;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none}
.panel .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;z-index:2}
.panel .x svg{width:18px;height:18px}
.pbody{overflow-y:auto;padding:28px 24px 28px;flex:1;overscroll-behavior:contain}
.phead{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:center;padding-right:40px}
.phead h2{font-size:1.45rem;font-weight:900;word-break:break-word}
.phead .host{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:4px;word-break:break-all}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pdesc{font-size:1.04rem;margin-top:18px;line-height:1.75}
.pacts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.pacts .btn{flex:1;justify-content:center;min-width:150px}
.facts{margin-top:24px;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--mono);font-size:.74rem;background:var(--card);border:1px solid var(--line);padding:1px 8px;border-radius:6px;color:#BFCDD4}
details.orig{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.orig summary{cursor:pointer;font-size:.88rem;font-weight:700;color:var(--muted)}
details.orig p{margin-top:10px;font-size:.88rem;color:#BFCDD4;line-height:1.65}
.how{margin-top:18px;font-size:.86rem;color:var(--muted);background:rgba(95,211,188,.06);border:1px solid rgba(95,211,188,.2);border-radius:12px;padding:12px 14px}
.how b{color:var(--ink)}
.related{margin-top:26px}
.related h3{font-size:.95rem;font-weight:700;margin-bottom:10px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:6px;cursor:pointer}
.mini button:hover{background:var(--card);border-color:var(--line)}
.mini .ic{width:40px;height:40px;border-radius:10px}
.mini .ic .mono{font-size:1rem}
.mini .ic.small img{inset:9px}
.mini b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- responsive ---------- */
@media (max-width:1100px){.rail{grid-auto-columns:calc((100% - 2*14px)/3)}}
@media (max-width:860px){
  .slide{grid-template-columns:minmax(0,1fr) 140px;padding:30px 26px 56px;min-height:0}
  .art{width:140px}
  .dots{left:26px}
  .rail{grid-auto-columns:calc((100% - 14px)/2)}
  .note{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top .wrap{gap:10px;min-height:58px}
  .brand b{font-size:0}
  .brand b em{font-size:.78rem;margin-left:0}
  .back{padding:8px 12px;font-size:.84rem}
  .back .lbl{display:none}
  .slide{grid-template-columns:minmax(0,1fr);gap:4px;padding:24px 20px 60px}
  .art{position:absolute;right:16px;top:18px;width:84px}
  .slide .eyebrow,.slide h2{padding-right:96px}
  .slide .why{font-size:.95rem}
  .slide .acts .btn{padding:10px 16px;font-size:.88rem}
  .dots{left:20px;bottom:22px}
  .arrows{display:none}
  .rail{grid-auto-columns:82%;margin-left:calc(-1 * var(--gut));margin-right:calc(-1 * var(--gutr));padding-left:var(--gut);padding-right:var(--gutr);scroll-padding-inline:var(--gut)}
  .rail.tall{grid-template-rows:repeat(3,auto)}
  .sec-h .ctl{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .strip .part{margin-left:0}
  .panel{top:auto;width:100%;height:min(88vh,100%);border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(100%);padding-right:0}
  .pbody{padding:24px var(--gutr) 28px var(--gut)}
  .panel .x{top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#16242D"/><rect x="6" y="6" width="9" height="9" rx="2.5" fill="#5FD3BC"/><rect x="17" y="6" width="9" height="9" rx="2.5" fill="#fff"/><rect x="6" y="17" width="9" height="9" rx="2.5" fill="#fff"/><rect x="17" y="17" width="9" height="9" rx="2.5" fill="#fff" fill-opacity=".4"/></svg>
      <b>KitLab<span> Dash</span><em>應用商店</em></b>
    </a>
    <label class="q" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="sr">搜尋應用</span>
      <input id="q" type="search" placeholder="搜尋應用名稱或用途，例如：白板、PDF、記帳" autocomplete="off" enterkeyhint="search">
      <button class="clear" type="button" id="qclear" aria-label="清除搜尋" hidden>✕</button>
    </label>
    <a class="back" href="../" aria-label="回 KitLab Dash"><span aria-hidden="true">←</span><span class="lbl mycount"> 回 Dash<b id="mycnt" hidden></b></span></a>
  </div>
  <nav class="cats" aria-label="應用分類"><div class="wrap" id="cats"></div></nav>
</header>

<main id="main"></main>

<footer>
  <div class="wrap">
    <span>商店裡是其他開發者的網頁應用，名稱、圖示與商標屬於各自的開發者。KitLab 只寫介紹；安裝到 Dash 只是在你的 Dash 放一個捷徑，點開仍是官方網站。</span>
    <span>KitLab Dash 應用商店 · 第一部分 · 目錄更新於 <span data-updated>2026-10-18</span></span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"><b></b><span id="toastTxt"></span><a href="../">回 Dash 看看</a></div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" aria-hidden="true">
  <button class="x" type="button" id="pclose" aria-label="關閉介紹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="pbody" id="pbody"></div>
</aside>

<script>
const API='/api';
const PRE=null;
(async function(){
let D=PRE;
if(!D){
  try{const r=await fetch(API+'/v1/catalog');if(r.ok)D=await r.json()}catch(e){}
  if(!D||!D.ok){try{const r=await fetch('catalog.json',{cache:'no-cache'});if(r.ok)D=await r.json()}catch(e){}}
}
if(!D||!D.apps){document.querySelector('#main').innerHTML='<div class="wrap empty"><b>商店目錄載入失敗</b>請確認網路後重新整理。</div>';return}
const APPS=D.apps, HERO=D.hero||[], CATS=D.cats;
document.querySelectorAll('[data-updated]').forEach(el=>el.textContent=D.updated||'');
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const BY=Object.fromEntries(APPS.map(a=>[a.i,a]));
const HEROICON=Object.fromEntries(HERO.map(h=>[h.i,h.icon]));
APPS.forEach((a,ix)=>{a.ord=ix;a.host=hostOf(a.u);a.key=(a.n+' '+a.d+' '+a.e+' '+(a.t||[]).join(' ')+' '+a.host+' '+(a.p||'')+' '+CAT[a.c].n).toLowerCase()});
CATS.forEach(c=>c.list=APPS.filter(a=>a.c===c.k));

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
const ICO={
 ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>'};

/* ---------- icons: 官方圖示，載不到就用字母圖塊 ---------- */
function mono(a){const m=a.n.replace(/^[^A-Za-z0-9㐀-鿿Ѐ-ӿ؀-ۿ가-힯]+/,'');return esc((m[0]||a.n[0]||'?').toUpperCase())}
function iconSrc(a){return HEROICON[a.i]||('https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url='+encodeURIComponent('https://'+new URL(a.u).hostname)+'&size=128')}
function iconHTML(a,cls=''){
  const h=CAT[a.c].h;
  return `<div class="ic ${cls}" style="--mg:linear-gradient(140deg,${h},color-mix(in srgb,${h} 45%,#0B141A))"><span class="mono" aria-hidden="true">${mono(a)}</span><img alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(iconSrc(a))}" onload="icOK(this)" onerror="this.remove()"></div>`;
}
window.icOK=function(img){const w=img.naturalWidth;if(!w){img.remove();return}const p=img.parentNode;p.classList.add('has');if(w<48&&!img.src.startsWith('data:'))p.classList.add('small')};

/* ---------- 安裝到 Dash：清單存在這台裝置（和 Dash 同網域共用） ---------- */
const KEY='kitlab-dash-installed', JUST='kitlab-dash-just';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let INST=ls.get(KEY)||[];
let BUILTIN=new Set();
const pid=a=>'p'+a.i;
const isInst=a=>INST.some(x=>x.id===pid(a));
const isBuiltin=a=>BUILTIN.has(a.host+'|'+(new URL(a.u).pathname.replace(/\/$/,'')));
function toDash(a){
  const c=CAT[a.c];
  return{id:pid(a),name:a.n,url:a.u,dev:a.p||a.host,kind:'PWA',short:c.n,why:a.d,color:c.h,
    icon:iconSrc(a),fav:1,tags:[c.n].concat(a.o?['離線可用']:[]),installed:1,at:Date.now()};
}
function toggleInstall(i){
  const a=BY[i];if(!a||isBuiltin(a))return;
  INST=ls.get(KEY)||[];
  let just=ls.get(JUST)||[];
  if(isInst(a)){INST=INST.filter(x=>x.id!==pid(a));just=just.filter(x=>x!==pid(a));toast(`已從 Dash 移除 ${a.n}`)}
  else{INST.push(toDash(a));just.push(pid(a));toast(`已安裝到 Dash：${a.n}`)}
  if(!ls.set(KEY,INST)){toast('這個瀏覽器不允許儲存，無法安裝到 Dash');return}
  ls.set(JUST,just);refreshInstall();
  if(window.KitLabSync)window.KitLabSync.sync().catch(()=>{});
}
function getBtn(a){
  if(isBuiltin(a))return `<span class="get builtin">Dash 內建</span>`;
  return isInst(a)?`<button class="get done" type="button" data-inst="${a.i}" aria-label="${esc(a.n)} 已安裝，按一下從 Dash 移除">已安裝</button>`
    :`<button class="get inst" type="button" data-inst="${a.i}" aria-label="安裝 ${esc(a.n)} 到 Dash">安裝</button>`;
}
function pActs(a){
  const go=`<a class="btn ghost" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer">前往官方網站${ICO.ext}</a>`;
  if(isBuiltin(a))return `<span class="btn ghost" style="cursor:default">已內建在 Dash</span>`+go;
  return (isInst(a)?`<button class="btn danger" type="button" data-inst="${a.i}">從 Dash 移除</button>`:`<button class="btn" type="button" data-inst="${a.i}">安裝到 Dash</button>`)+go;
}
function refreshInstall(){
  document.querySelectorAll('.foot .get').forEach(el=>{const card=el.closest('.card');const id=+card.querySelector('.hit').dataset.app;el.outerHTML=getBtn(BY[id])});
  const pa=$('#pacts');if(pa&&cur)pa.innerHTML=pActs(cur);
  const n=INST.length,m=$('#mycnt');if(m){m.hidden=!n;m.textContent=n}const k=$('#instN');if(k)k.textContent=n;
}
let tt=null;
function toast(msg){$('#toastTxt').textContent=msg;$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),3800)}
addEventListener('storage',e=>{if(e.key===KEY){INST=ls.get(KEY)||[];refreshInstall()}});
fetch('../sites.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;
  d.sites.forEach(s=>{try{const u=new URL(s.url);BUILTIN.add(u.hostname.replace(/^www\./,'')+'|'+u.pathname.replace(/\/$/,''))}catch(e){}});
  INST=INST.filter(x=>!BUILTIN.has(hostOf(x.url)+'|'+new URL(x.url).pathname.replace(/\/$/,'')));ls.set(KEY,INST);refreshInstall()}).catch(()=>{});

/* ---------- card ---------- */
function card(a){
  const c=CAT[a.c];
  return `<article class="card">
    <button class="hit" type="button" data-app="${a.i}" aria-label="查看 ${esc(a.n)} 的介紹"></button>
    ${iconHTML(a)}
    <div class="nm"><h3 title="${esc(a.n)}">${esc(a.n)}</h3><span class="cat"><i style="background:${c.h}"></i>${c.n}</span></div>
    <p class="desc">${esc(a.d)}</p>
    <div class="foot">${a.f?'<span class="badge pick">精選</span>':''}${a.o?'<span class="badge off">離線可用</span>':''}<span class="badge">免費</span>
      ${getBtn(a)}</div>
  </article>`;
}
const sorted=list=>[...list].sort((x,y)=>(y.f||0)-(x.f||0)||x.ord-y.ord);

/* ---------- nav ---------- */
function renderCats(cur){
  const items=[{k:'home',n:'首頁'},{k:'picks',n:'編輯精選',cnt:APPS.filter(a=>a.f).length},{k:'all',n:'全部',cnt:APPS.length},...CATS.map(c=>({k:c.k,n:c.n,h:c.h,cnt:c.list.length})),{k:'offline',n:'離線可用',cnt:APPS.filter(a=>a.o).length}];
  $('#cats').innerHTML=items.map(it=>`<button class="chip" type="button" data-go="${it.k}" aria-current="${it.k===cur}">${it.h?`<i style="background:${it.h}"></i>`:''}${it.n}${it.cnt?`<span class="n">${it.cnt}</span>`:''}</button>`).join('');
  const on=$('#cats [aria-current="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
}

/* ---------- home ---------- */
let heroIx=0,heroTimer=null;
function renderHome(){
  const slides=HERO.map((h,ix)=>{const a=BY[h.i];return `<div class="slide" style="--c:${h.color}" role="group" aria-roledescription="輪播項目" aria-label="${ix+1} / ${HERO.length}：${esc(a.n)}">
      <div><div class="eyebrow"><b>本期精選</b>${esc(h.short)} · ${CAT[a.c].n}</div>
        <h2>${esc(a.n)}</h2><p class="why">${esc(h.why)}</p><p class="by">開發者：${esc(h.dev)}</p>
        <div class="acts"><a class="btn" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer">前往官方網站${ICO.ext}</a><button class="btn ghost" type="button" data-app="${a.i}">查看介紹</button></div></div>
      <div class="art"><img src="${h.icon}" alt="${esc(a.n)} 圖示"></div></div>`}).join('');
  const picks=sorted(APPS.filter(a=>a.f));
  const offline=sorted(APPS.filter(a=>a.o)).slice(0,24);
  const fresh=APPS.filter(a=>a.s==='pm').slice(-16).reverse();
  let html=`<section class="hero wrap" aria-label="本期精選">
    <div class="stage"><div class="slides" id="slides">${slides}</div>
      <div class="dots" id="dots">${HERO.map((h,ix)=>`<button type="button" aria-label="第 ${ix+1} 則" data-dot="${ix}"></button>`).join('')}</div>
      <div class="arrows"><button type="button" id="hprev" aria-label="上一則">${ICO.l}</button><button type="button" id="hnext" aria-label="下一則">${ICO.r}</button></div></div>
    <div class="strip"><span><b>${APPS.length}</b>款收錄應用</span><span><b>${CATS.length}</b>個分類</span><span><b>${picks.length}</b>款編輯精選</span><span><b id="instN">0</b>款已裝到你的 Dash</span><span class="part">第一部分</span></div>
  </section>`;
  html+=railSec('picks','編輯精選','大家常用、做得特別好的作品',picks.slice(0,32),'#F2C14E',true);
  CATS.slice(0,4).forEach(c=>html+=railSec(c.k,c.n,`${c.list.length} 款`,sorted(c.list).slice(0,16),c.h));
  html+=railSec('offline','離線也能用','裝到桌面後，沒有網路照樣能開',offline,'#5FD3BC');
  CATS.slice(4).forEach(c=>html+=railSec(c.k,c.n,`${c.list.length} 款`,sorted(c.list).slice(0,16),c.h));
  html+=railSec('fresh','最新收錄','剛加入清單的新面孔',fresh,'#93A6B1',false,true);
  html+=noteHTML();
  $('#main').innerHTML=html;
  initRails();initHero();setTimeout(refreshInstall,0);
}
function railSec(k,title,sub,list,color,tall,nomore){
  return `<section class="sec wrap" aria-labelledby="h-${k}">
    <div class="sec-h"><span class="bar" style="background:${color}"></span><div><h2 id="h-${k}">${title}</h2><p class="sub">${sub}</p></div>
    ${nomore?'<span class="more" style="visibility:hidden"></span>':`<button class="more" type="button" data-go="${k}">查看全部${ICO.r}</button>`}
    <div class="ctl"><button type="button" data-rail="-1" aria-label="往左">${ICO.l}</button><button type="button" data-rail="1" aria-label="往右">${ICO.r}</button></div></div>
    <div class="rail${tall?' tall':''}">${list.map(card).join('')}</div></section>`;
}
function noteHTML(){
  return `<section class="note wrap" aria-label="使用說明">
   <div><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>安裝到 Dash</h3><p>按「安裝」，應用就會出現在 Dash 的站點格裡，也能加到 Dock。不用登入，安裝清單只存在這台裝置。想把某個應用單獨裝成 App，到它的官方網站用瀏覽器的「安裝」或「加入主畫面」。</p></div>
   <div><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>我們怎麼挑</h3><p>從公開的 PWA 目錄整理，拿掉範例專案、練習作品、說明不清的站點，以及仿冒、成人、博弈與高風險交易類網站。每一款都附中文說明。</p></div>
   <div><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>開啟前看一下</h3><p>這些應用由各自的開發者經營，帳號、付費方案與隱私政策以官方網站為準。標示「免費」代表可以免費開始使用，部分功能可能另外收費。</p></div>
  </section>`;
}
function initHero(){
  const n=HERO.length;
  const go=ix=>{heroIx=(ix+n)%n;$('#slides').style.transform=`translateX(${-heroIx*100}%)`;document.querySelectorAll('#dots button').forEach((b,i)=>b.setAttribute('aria-current',i===heroIx));
    document.querySelectorAll('.slide').forEach((s,i)=>{s.inert=i!==heroIx;s.setAttribute('aria-hidden',i!==heroIx)})};
  go(heroIx);
  $('#hprev').onclick=()=>{go(heroIx-1);stop()};$('#hnext').onclick=()=>{go(heroIx+1);stop()};
  $('#dots').onclick=e=>{const b=e.target.closest('[data-dot]');if(b){go(+b.dataset.dot);stop()}};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stop(){clearInterval(heroTimer);heroTimer=null}
  stop();if(!reduce)heroTimer=setInterval(()=>go(heroIx+1),6500);
  const st=$('.stage');st.addEventListener('mouseenter',stop);st.addEventListener('focusin',stop);
  let sx=null;st.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){go(heroIx+(dx<0?1:-1));stop()}sx=null});
}
function initRails(){
  document.querySelectorAll('.rail').forEach(r=>{
    let down=false,moved=false,sx=0,sl=0;
    r.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=r.scrollLeft});
    r.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;r.classList.add('dragging')}if(moved)r.scrollLeft=sl-dx});
    const up=()=>{if(!down)return;down=false;setTimeout(()=>r.classList.remove('dragging'),0)};
    r.addEventListener('pointerup',up);r.addEventListener('pointerleave',up);
    r.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
  });
}

/* ---------- list view ---------- */
let view={k:'home'},shown=0,sortMode='pick';
const PAGE=48;
function listFor(k){
  if(k==='picks')return{t:'編輯精選',s:'大家常用、做得特別好的作品，先從這裡逛起。',l:APPS.filter(a=>a.f)};
  if(k==='all')return{t:'全部應用',s:`收錄的 ${APPS.length} 款網頁應用，全部都能直接在瀏覽器開啟。`,l:APPS};
  if(k==='offline')return{t:'離線可用',s:'安裝到桌面或主畫面後，沒有網路也能開。',l:APPS.filter(a=>a.o)};
  if(k==='fresh')return{t:'最新收錄',s:'剛加入清單的新面孔。',l:APPS.filter(a=>a.s==='pm').reverse()};
  const c=CAT[k];return{t:c.n,s:`${c.list.length} 款${c.n}類網頁應用。`,l:c.list,c};
}
function sortList(l){
  if(sortMode==='name')return[...l].sort((x,y)=>x.n.localeCompare(y.n,'zh-Hant'));
  if(sortMode==='offline')return[...l].sort((x,y)=>(y.o||0)-(x.o||0)||(y.f||0)-(x.f||0)||x.ord-y.ord);
  return sorted(l);
}
function renderList(k){
  const L=listFor(k);const list=sortList(L.l);shown=Math.min(PAGE,list.length);
  $('#main').innerHTML=`<section class="wrap">
    <div class="view-h"><div><h1>${L.t}</h1></div>
      <div class="sort" role="group" aria-label="排序">${[['pick','精選優先'],['name','名稱'],['offline','離線優先']].map(([m,t])=>`<button type="button" data-sort="${m}" aria-pressed="${sortMode===m}">${t}</button>`).join('')}</div>
      <p class="sub">${L.s}</p></div>
    <div class="grid" id="grid" style="margin-top:18px">${list.slice(0,shown).map(card).join('')}</div>
    <div class="loadmore" id="lm"></div></section>`;
  moreBtn(list);
}
function moreBtn(list){
  const lm=$('#lm');if(!lm)return;
  lm.innerHTML=shown<list.length?`<button class="btn ghost" type="button" id="more">再看 ${Math.min(PAGE,list.length-shown)} 款（${shown} / ${list.length}）</button>`:'';
  const b=$('#more');if(b)b.onclick=()=>{const nx=list.slice(shown,shown+PAGE);shown+=nx.length;$('#grid').insertAdjacentHTML('beforeend',nx.map(card).join(''));moreBtn(list)};
}
function renderSearch(q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=APPS.filter(a=>words.every(w=>a.key.includes(w)));
  const score=a=>(a.n.toLowerCase().includes(words[0])?4:0)+(a.d.toLowerCase().includes(words[0])?2:0)+(a.f?1:0);
  hits.sort((x,y)=>score(y)-score(x)||x.ord-y.ord);
  shown=Math.min(PAGE,hits.length);
  $('#main').innerHTML=`<section class="wrap"><div class="view-h"><div><h1>「${esc(q)}」</h1></div><p class="sub">找到 ${hits.length} 款應用</p></div>
    ${hits.length?`<div class="grid" id="grid" style="margin-top:18px">${hits.slice(0,shown).map(card).join('')}</div><div class="loadmore" id="lm"></div>`:
    `<div class="empty"><b>沒有找到符合的應用</b>換個說法試試，例如「PDF」「白板」「記帳」「音樂」，或從上方分類逛逛。</div>`}</section>`;
  moreBtn(hits);
}

/* ---------- router ---------- */
function go(k,push=true){
  view={k};$('#q').value='';$('#qclear').hidden=true;
  renderCats(k);
  if(k==='home')renderHome();else renderList(k);
  if(push){try{history.replaceState(null,'',k==='home'?location.pathname+location.search:'#'+k)}catch(e){}}
  window.scrollTo({top:0});
}
let qt=null;
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim();$('#qclear').hidden=!q;clearTimeout(qt);
  qt=setTimeout(()=>{if(q){view={k:'search'};renderCats('');renderSearch(q)}else go('home')},140);
});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.value){e.target.value='';go('home')}});
$('#qclear').onclick=()=>{go('home');$('#q').focus()};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const ins=e.target.closest('[data-inst]');if(ins){toggleInstall(+ins.dataset.inst);return}
  const a=e.target.closest('[data-app]');if(a){openApp(+a.dataset.app,a);return}
  const s=e.target.closest('[data-sort]');if(s){sortMode=s.dataset.sort;renderList(view.k);return}
  const rb=e.target.closest('[data-rail]');if(rb){const r=rb.closest('.sec').querySelector('.rail');r.scrollBy({left:+rb.dataset.rail*r.clientWidth*.9,behavior:'smooth'})}
});

/* ---------- detail panel ---------- */
let lastFocus=null,cur=null;
function openApp(i,from){
  const a=BY[i];if(!a)return;cur=a;const c=CAT[a.c];lastFocus=from||document.activeElement;
  const rel=sorted(c.list.filter(x=>x.i!==a.i)).slice(0,5);
  const src=a.s==='pm'?'pwamart.com':'pwa.directory';
  $('#pbody').innerHTML=`<div class="phead">${iconHTML(a,'xl')}<div><h2 id="ptitle">${esc(a.n)}</h2><p class="host">${esc(a.host)}</p></div></div>
    <div class="pchips">${a.f?'<span class="badge pick">編輯精選</span>':''}<span class="badge" style="color:${c.h}">${c.n}</span><span class="badge">免費開始</span>${a.o?'<span class="badge off">離線可用</span>':''}<span class="badge">可安裝</span><span class="badge">跨平台</span></div>
    <p class="pdesc">${esc(a.d)}</p>
    <div class="pacts" id="pacts">${pActs(a)}</div>
    <dl class="facts">
      ${a.p?`<div><dt>開發者</dt><dd>${esc(a.p)}</dd></div>`:''}
      <div><dt>官方網址</dt><dd><a href="${esc(a.u)}" target="_blank" rel="noopener noreferrer">${esc(a.host)}</a></dd></div>
      <div><dt>分類</dt><dd>${c.n}</dd></div>
      ${a.t?`<div><dt>標籤</dt><dd class="tags">${a.t.map(t=>`<span>${esc(t)}</span>`).join('')}</dd></div>`:''}
      <div><dt>收錄來源</dt><dd><a href="${esc(a.l)}" target="_blank" rel="noopener noreferrer">${src}</a></dd></div>
    </dl>
    ${a.e?`<details class="orig"><summary>原文介紹（英文）</summary><p>${esc(a.e)}${a.e.length>=420?'…':''}</p></details>`:''}
    <details class="orig rep" id="rep"><summary>回報這個應用（打不開、介紹不對）</summary>
      <form id="repForm" style="margin-top:10px;display:grid;gap:8px">
        <label class="sr" for="repMsg">回報內容</label>
        <textarea id="repMsg" rows="3" maxlength="2000" required placeholder="哪裡打不開、介紹哪裡不對？" style="font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical"></textarea>
        <input id="repWeb" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        <button class="btn" type="submit" style="justify-self:start;padding:9px 18px">送出回報</button>
      </form></details>
    <p class="how"><b>安裝到 Dash</b> 之後，從 Dash 的站點格或 Dock 點它，就會開啟官方網站。想單獨裝成 App：電腦用 Chrome 或 Edge 開啟官方網站，點網址列的安裝圖示；iPhone 用 Safari 開啟，分享 →「加入主畫面」。</p>
    ${rel.length?`<div class="related"><h3>同類的其他應用</h3><div class="mini">${rel.map(r=>`<button type="button" data-app="${r.i}">${iconHTML(r)}<div style="min-width:0"><b>${esc(r.n)}</b><span>${esc(r.d)}</span></div></button>`).join('')}</div></div>`:''}`;
  $('#pbody').scrollTop=0;
  $('#panel').classList.add('open');$('#panel').setAttribute('aria-hidden','false');$('#scrim').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>$('#pclose').focus({preventScroll:true}),30);
}
function closeApp(){
  if(!$('#panel').classList.contains('open'))return;
  $('#panel').classList.remove('open');$('#panel').setAttribute('aria-hidden','true');$('#scrim').classList.remove('open');
  document.body.style.overflow='';
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});
}
$('#pclose').onclick=closeApp;
async function sendFeedback(data){
  const r=await fetch(API+'/v1/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'送出失敗，請稍後再試');
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='repForm')return;e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='送出中…';
  try{await sendFeedback({kind:'fix',source:'store',app_id:'p'+cur.i,app_name:cur.n,url:cur.u,message:$('#repMsg').value,website:$('#repWeb').value});
    $('#rep').innerHTML='<p style="margin:0;color:var(--teal-bright)">收到了，謝謝你。我們會盡快確認。</p>';}
  catch(err){btn.disabled=false;btn.textContent='送出回報';toast(err.message)}
});$('#scrim').onclick=closeApp;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeApp();
  if(e.key==='Tab'&&$('#panel').classList.contains('open')){
    const f=[...$('#panel').querySelectorAll('a,button,summary')].filter(el=>el.offsetParent);if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}
  }
});

/* ---------- start ---------- */
const start=(location.hash||'').slice(1);
const valid=['picks','all','offline','fresh',...CATS.map(c=>c.k)];
go(valid.includes(start)?start:'home',false);
refreshInstall();
})();
</script>

</body>
