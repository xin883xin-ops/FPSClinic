<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人化啟動器 (Speed Dial)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-input {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat transition-all duration-700 text-slate-800 dark:text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white" id="mainBody" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80')">

    <!-- Top Bar -->
    <header class="w-full p-4 md:p-6 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid fa-compass text-indigo-500 dark:text-indigo-400"></i>
            </div>
            <span class="font-bold text-lg tracking-wide drop-shadow">SpeedDial</span>
        </div>
        <div class="flex items-center space-x-3">
            <!-- Theme Toggle Button -->
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition" title="切換深色/淺色模式">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <!-- Settings Modal Button -->
            <button onclick="openSettingsModal()" class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition" title="個人化設定">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl mx-auto px-4 flex flex-col items-center justify-center my-auto py-8 z-10">
        
        <!-- Clock & Date Widget -->
        <div class="text-center mb-8 drop-shadow-md select-none">
            <h1 id="clockTime" class="text-6xl md:text-8xl font-black tracking-tight mb-2 text-white drop-shadow-lg">12:00</h1>
            <p id="clockDate" class="text-lg md:text-xl font-medium text-white/90 drop-shadow">2026年10月11日 星期日</p>
        </div>

        <!-- Search Bar Component -->
        <div class="w-full max-w-2xl mb-12">
            <form id="searchForm" onsubmit="handleSearch(event)" class="glass-panel rounded-3xl p-2 shadow-2xl flex items-center transition-all focus-within:ring-2 focus-within:ring-indigo-400">
                <!-- Search Engine Selector -->
                <div class="relative">
                    <select id="searchEngineSelect" onchange="changeSearchEngine(this.value)" class="appearance-none bg-transparent py-3 pl-4 pr-8 rounded-2xl text-sm font-semibold cursor-pointer focus:outline-none text-slate-700 dark:text-slate-200">
                        <option value="google" class="dark:bg-slate-800">Google</option>
                        <option value="bing" class="dark:bg-slate-800">Bing</option>
                        <option value="duckduckgo" class="dark:bg-slate-800">DuckDuckGo</option>
                        <option value="baidu" class="dark:bg-slate-800">Baidu</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
                <div class="h-6 w-[1px] bg-white/20 mx-2"></div>
                <!-- Search Input -->
                <input type="text" id="searchInput" placeholder="搜尋 Google 或輸入網址..." class="w-full bg-transparent px-4 py-3 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-400 focus:outline-none text-base md:text-lg">
                <!-- Search Submit Button -->
                <button type="submit" class="w-12 h-12 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition shrink-0">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>

        <!-- Speed Dial Shortcuts Grid -->
        <div class="w-full">
            <div id="shortcutsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                <!-- Dynamically Rendered Shortcuts Here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full p-4 text-center text-xs text-white/70 drop-shadow z-10">
        <p>&copy; 2026 SpeedDial Personal Launcher. All rights reserved.</p>
    </footer>

    <!-- Add / Edit Shortcut Modal -->
    <div id="shortcutModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 animate-fade-in">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold">新增捷徑</h3>
                <button onclick="closeShortcutModal()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="shortcutForm" onsubmit="saveShortcut(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="-1">
                <div>
                    <label class="block text-xs font-semibold mb-1 uppercase tracking-wider text-slate-500 dark:text-slate-400">網站名稱</label>
                    <input type="text" id="shortTitle" required placeholder="例如: Google" class="w-full glass-input px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 uppercase tracking-wider text-slate-500 dark:text-slate-400">網址 (URL)</label>
                    <input type="url" id="shortUrl" required placeholder="https://www.google.com" class="w-full glass-input px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeShortcutModal()" class="px-5 py-2.5 rounded-2xl glass-panel hover:bg-white/20 transition text-sm font-semibold">取消</button>
                    <button type="submit" class="px-5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg transition text-sm font-semibold">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-gear text-indigo-500"></i> 個人化設定</h3>
                <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-6">
                <!-- Background Options -->
                <div>
                    <label class="block text-sm font-semibold mb-3 text-slate-700 dark:text-slate-200">背景桌布選擇</label>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <button type="button" onclick="changeBackground('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80')" class="h-20 rounded-2xl bg-cover bg-center border-2 border-transparent hover:border-indigo-500 shadow-md transition" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=80')"></button>
                        <button type="button" onclick="changeBackground('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2000&q=80')" class="h-20 rounded-2xl bg-cover bg-center border-2 border-transparent hover:border-indigo-500 shadow-md transition" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=400&q=80')"></button>
                        <button type="button" onclick="changeBackground('https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=2000&q=80')" class="h-20 rounded-2xl bg-cover bg-center border-2 border-transparent hover:border-indigo-500 shadow-md transition" style="background-image: url('https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=400&q=80')"></button>
                        <button type="button" onclick="changeBackground('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80')" class="h-20 rounded-2xl bg-cover bg-center border-2 border-transparent hover:border-indigo-500 shadow-md transition" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80')"></button>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">自訂圖片網址</label>
                        <div class="flex space-x-2">
                            <input type="url" id="customBgUrl" placeholder="https://example.com/image.jpg" class="w-full glass-input px-3 py-2 rounded-xl text-sm focus:outline-none">
                            <button onclick="applyCustomBackground()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition shrink-0">套用</button>
                        </div>
                    </div>
                </div>

                <!-- Data Management -->
                <div class="border-t border-white/20 pt-4">
                    <label class="block text-sm font-semibold mb-3 text-slate-700 dark:text-slate-200">資料管理</label>
                    <div class="flex space-x-3">
                        <button onclick="exportData()" class="px-4 py-2 rounded-xl glass-panel hover:bg-white/25 text-sm font-semibold transition flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> 匯出捷徑
                        </button>
                        <label class="px-4 py-2 rounded-xl glass-panel hover:bg-white/25 text-sm font-semibold transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-upload"></i> 匯入捷徑
                            <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-6">
                <button onclick="closeSettingsModal()" class="px-5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg transition text-sm font-semibold">完成</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Default shortcuts if localStorage is empty
        const defaultShortcuts = [
            { title: 'Google', url: 'https://www.google.com' },
            { title: 'YouTube', url: 'https://www.youtube.com' },
            { title: 'GitHub', url: 'https://github.com' },
            { title: 'ChatGPT', url: 'https://chat.openai.com' },
            { title: 'X (Twitter)', url: 'https://twitter.com' },
            { title: 'Reddit', url: 'https://www.reddit.com' },
            { title: 'Notion', url: 'https://www.notion.so' },
            { title: 'Wikipedia', url: 'https://www.wikipedia.org' }
        ];

        let shortcuts = JSON.parse(localStorage.getItem('speedDial_shortcuts')) || defaultShortcuts;
        let searchEngine = localStorage.getItem('speedDial_searchEngine') || 'google';
        let bgImage = localStorage.getItem('speedDial_bg') || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80';
        let isDarkMode = localStorage.getItem('speedDial_darkMode') === 'true';

        // Initialize App on Load
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);

            // Apply saved states
            document.getElementById('mainBody').style.backgroundImage = `url('${bgImage}')`;
            document.getElementById('searchEngineSelect').value = searchEngine;
            
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }

            renderShortcuts();
        };

        // Clock and Date Updater
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockTimeinnerText') = `${hours}:${minutes}`;
            const timeEl = document.getElementById('clockTime');
            if(timeEl) timeEl.innerText = `${hours}:${minutes}`;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-TW', options);
            const dateEl = document.getElementById('clockDate');
            if(dateEl) dateEl.innerText = dateStr;
        }

        // Search Engine Routing
        const searchUrls = {
            google: 'https://www.google.com/search?q=',
            bing: 'https://www.bing.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q=',
            baidu: 'https://www.baidu.com/s?wd='
        };

        function changeSearchEngine(engine) {
            searchEngine = engine;
            localStorage.setItem('speedDial_searchEngine', engine);
        }

        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Check if query is a valid URL
            if (query.startsWith('http://') || query.startsWith('https://') || (query.includes('.') && !query.includes(' '))) {
                const targetUrl = query.startsWith('http') ? query : 'https://' + query;
                window.location.href = targetUrl;
            } else {
                const url = (searchUrls[searchEngine] || searchUrls.google) + encodeURIComponent(query);
                window.location.href = url;
            }
        }

        // Render Shortcuts Grid
        function renderShortcuts() {
            const grid = document.getElementById('shortcutsGrid');
            grid.innerHTML = '';

            shortcuts.forEach((item, index) => {
                let domain = '';
                try {
                    const urlObj = new URL(item.url);
                    domain = urlObj.hostname;
                } catch (e) {
                    domain = item.url;
                }
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

                const card = document.createElement('div');
                card.className = "glass-panel group relative rounded-3xl p-4 flex flex-col items-center justify-center gap-3 shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 cursor-pointer";
                card.onclick = (e) => {
                    // Prevent opening if clicking action buttons
                    if(e.target.closest('.action-btn')) return;
                    window.location.href = item.url;
                };

                card.innerHTML = `
                    <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity flex space-x-1 action-btn">
                        <button onclick="openEditModal(${index})" class="w-7 h-7 rounded-full bg-black/30 hover:bg-black/50 text-white flex items-center justify-center text-xs transition" title="編輯">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteShortcut(${index})" class="w-7 h-7 rounded-full bg-rose-500/80 hover:bg-rose-600 text-white flex items-center justify-center text-xs transition" title="刪除">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-white/20 dark:bg-slate-800/60 flex items-center justify-center p-3 shadow-inner group-hover:scale-110 transition duration-300">
                        <img src="${faviconUrl}" alt="${item.title}" class="w-8 h-8 object-contain drop-shadow" onerror="this.src='https://placehold.co/64x64/6366f1/ffffff?text=${encodeURIComponent(item.title.charAt(0))}'">
                    </div>
                    <span class="text-sm font-semibold truncate w-full text-center drop-shadow">${item.title}</span>
                `;
                grid.appendChild(card);
            });

            // Add 'New Shortcut' Button Card
            const addCard = document.createElement('div');
            addCard.className = "glass-panel rounded-3xl p-4 flex flex-col items-center justify-center gap-3 shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 cursor-pointer border-dashed border-2 border-white/30";
            addCard.onclick = openAddModal;
            addCard.innerHTML = `
                <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center text-xl text-slate-500 dark:text-slate-400 group-hover:scale-110 transition duration-300">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <span class="text-sm font-semibold text-slate-500 dark:text-slate-400">新增捷徑</span>
            `;
            grid.appendChild(addCard);
        }

        // Modal Controls
        const modal = document.getElementById('shortcutModal');
        const settingsModal = document.getElementById('settingsModal');

        function openAddModal() {
            document.getElementById('modalTitle').innerText = '新增捷徑';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('shortTitle').value = '';
            document.getElementById('shortUrl').value = '';
            modal.classList.remove('hidden');
        }

        function openEditModal(index) {
            const item = shortcuts[index];
            document.getElementById('modalTitle').innerText = '編輯捷徑';
            document.getElementById('editIndex').value = index;
            document.getElementById('shortTitle').value = item.title;
            document.getElementById('shortUrl').value = item.url;
            modal.classList.remove('hidden');
        }

        function closeShortcutModal() {
            modal.classList.add('hidden');
        }

        function saveShortcut(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const title = document.getElementById('shortTitle').value.trim();
            let url = document.getElementById('shortUrl').value.trim();

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            if (index === -1) {
                shortcuts.push({ title, url });
            } else {
                shortcuts[index] = { title, url };
            }

            localStorage.setItem('speedDial_shortcuts', JSON.stringify(shortcuts));
            closeShortcutModal();
            renderShortcuts();
        }

        function deleteShortcut(index) {
            if (confirm('確定要刪除這個捷徑嗎？')) {
                shortcuts.splice(index, 1);
                localStorage.setItem('speedDial_shortcuts', JSON.stringify(shortcuts));
                renderShortcuts();
            }
        }

        // Settings Modal Controls
        function openSettingsModal() {
            settingsModal.classList.remove('hidden');
        }

        function closeSettingsModal() {
            settingsModal.classList.add('hidden');
        }

        function changeBackground(url) {
            bgImage = url;
            localStorage.setItem('speedDial_bg', url);
            document.getElementById('mainBody').style.backgroundImage = `url('${url}')`;
        }

        function applyCustomBackground() {
            const url = document.getElementById('customBgUrl').value.trim();
            if (url) {
                changeBackground(url);
                document.getElementById('customBgUrl').value = '';
            }
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('speedDial_darkMode', isDarkMode);
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }
        }

        // Export / Import Data
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(shortcuts));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "speeddial_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported)) {
                            shortcuts = imported;
                            localStorage.setItem('speedDial_shortcuts', JSON.stringify(shortcuts));
                            renderShortcuts();
                            closeSettingsModal();
                            alert('捷徑匯入成功！');
                        } else {
                            alert('檔案格式錯誤！');
                        }
                    } catch (error) {
                        alert('解析 JSON 檔案失敗！');
                    }
                }
            }
        }
    </script>
</body>
</html>
