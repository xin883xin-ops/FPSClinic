<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智慧名片 店家系統（範例）</title>
<meta name="description" content="像車用導航一樣的店家系統：左邊選功能，大按鈕操作，右邊即時看到客人掃 QR 看到的名片。">
<style>
:root{--bg:#070a0f;--bar:#0c1118;--tile:#121923;--tile2:#18212d;--line:#243142;--text:#f1f5f9;--soft:#94a3b8;--mute:#64748b;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--rest:#ef4444;--rail:88px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input{user-select:text}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.sys{height:100svh;display:grid;grid-template-rows:56px 1fr;grid-template-columns:var(--rail) minmax(0,1fr) 340px;grid-template-areas:"top top top" "rail main prev"}
/* top status bar */
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--bar);border-bottom:1px solid var(--line)}
.top .shop{font-weight:600;font-size:17px}.top .sub{color:var(--mute);font-size:13px}
.top .sp{flex:1}
.light{display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;font-weight:600;font-size:14px;background:#0a0f16;border:1px solid var(--line)}
.light i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.clock{font-variant-numeric:tabular-nums;color:var(--soft);font-size:15px;min-width:48px;text-align:right}
/* rail */
.rail{grid-area:rail;background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.rail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:76px;border-radius:14px;color:var(--soft);font-size:12.5px}
.rail button[aria-current=page]{background:var(--tile2);color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
/* main */
.main{grid-area:main;overflow-y:auto;padding:18px;min-width:0}
.page{display:none}.page.on{display:block}
h1{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--mute);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .08s,background .15s}
.tile:active{transform:scale(.97);background:var(--tile2)}
.tile .ic{color:var(--acc)}
.tile b{font-size:18px;font-weight:600;display:block}
.tile small{color:var(--soft);font-size:13.5px;display:block;margin-top:2px}
.tile.wide{grid-column:span 2}
.tile.stat{background:linear-gradient(160deg,var(--tile2),var(--tile))}
.tile.stat .big{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.tile.stat .big i{width:14px;height:14px;border-radius:50%;background:var(--c)}
/* big choices */
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.choice button{background:var(--tile);border:2px solid var(--line);border-radius:18px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:20px;font-weight:600}
.choice button i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.choice button small{font-size:13px;color:var(--soft);font-weight:400}
.choice button[aria-pressed=true]{border-color:var(--c);background:var(--tile2)}
.box{background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);min-height:64px}
.row:first-child{border-top:0}
.row[hidden]{display:none}
.row .l{min-width:0}.row .l b{font-weight:500;font-size:16.5px;display:block}.row .l small{color:var(--mute);font-size:13px;display:block}
input[type=time],input[type=text],input[type=number]{background:#0a0f16;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);min-width:0;font-size:16px}
.hours{display:flex;gap:8px;align-items:center}
.pill{border:2px solid var(--line);border-radius:99px;padding:10px 18px;font-weight:500;color:var(--soft);min-height:46px}
.pill[aria-pressed=true]{border-color:var(--rest);color:#fff;background:#7f1d1d}
.pill.sold[aria-pressed=true]{background:var(--rest);border-color:var(--rest)}
/* feature cards */
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.feat button{background:var(--tile);border:2px solid var(--line);border-radius:18px;padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative}
.feat button .ic{color:var(--mute)}
.feat button b{font-size:17px;font-weight:600;display:block}
.feat button small{font-size:13px;color:var(--mute);display:block;line-height:1.4}
.feat button .st{position:absolute;right:14px;top:14px;font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.feat button[aria-checked=true]{border-color:var(--acc);background:var(--tile2)}
.feat button[aria-checked=true] .ic{color:var(--acc)}
.feat button[aria-checked=true] .st{color:#04121c;background:var(--acc);border-color:var(--acc)}
.menu .it{display:grid;grid-template-columns:1fr 96px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.menu .it:first-child{border-top:0}
.hint{color:var(--mute);font-size:13px;margin:-4px 0 14px}
.link{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.link code{background:#0a0f16;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text);user-select:text;word-break:break-all}
/* preview */
.prev{grid-area:prev;background:var(--bar);border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;align-items:center;overflow-y:auto}
.prev .cap{color:var(--mute);font-size:12px;letter-spacing:.1em;margin-bottom:10px}
.phone{width:100%;max-width:300px;background:#000;border:1px solid #334155;border-radius:34px;padding:9px}
.screen{background:#f4f4f5;color:#18181b;border-radius:26px;overflow:hidden;min-height:520px;display:flex;flex-direction:column;user-select:none}
.p-head{padding:20px 16px 12px;background:#fff;border-bottom:1px solid #e4e4e7}
.p-head h3{font-size:21px;line-height:1.3}.p-head p{color:#71717a;font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 13px;border-radius:99px;font-weight:600;font-size:14px}
.badge i{width:9px;height:9px;border-radius:50%;background:currentColor}
.badge.ok{background:#dcfce7;color:#15803d}.badge.rest{background:#fee2e2;color:#b91c1c}.badge.early{background:#fef3c7;color:#b45309}
.p-hours{margin-top:5px;font-size:12.5px;color:#52525b}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px 12px 2px}
.acts a{background:#18181b;color:#fff;text-decoration:none;border-radius:11px;padding:10px 4px;text-align:center;font-weight:600;font-size:13.5px}
.acts a.alt{background:#fff;color:#18181b;border:1px solid #d4d4d8}
.p-sec{padding:12px 16px}.p-sec h4{font-size:11.5px;color:#71717a;letter-spacing:.1em;margin-bottom:4px}
.p-it{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #e4e4e7;font-size:14.5px}
.p-it:first-of-type{border-top:0}
.p-it.s{color:#a1a1aa}.p-it.s span:first-child{text-decoration:line-through}
.p-it em{font-style:normal;font-size:11.5px;color:#b91c1c;margin-left:6px}
.foot{margin-top:auto;padding:10px;text-align:center;font-size:11px;color:#a1a1aa}

@media(max-width:1100px){
 .sys{grid-template-columns:var(--rail) minmax(0,1fr);grid-template-areas:"top top" "rail main"}
 .prev{display:none}
 body.showprev .main{display:none}body.showprev .prev{display:flex;grid-area:main;border:0;background:var(--bg)}
}
@media(max-width:700px){
 .sys{grid-template-rows:52px 1fr 68px;grid-template-columns:1fr;grid-template-areas:"top" "main" "rail"}
 body.showprev .prev{grid-area:main}
 .rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;gap:4px}
 .rail button{flex:1;height:100%;font-size:11.5px;border-radius:12px}
 .rail button[aria-current=page]{box-shadow:inset 0 3px 0 var(--acc)}
 svg{width:26px;height:26px}
 .top .sub,.top .clock{display:none}
 .choice{grid-template-columns:1fr}.choice button{min-height:84px;flex-direction:row;gap:12px}
 .grid,.feat{grid-template-columns:1fr 1fr}.tile.wide{grid-column:span 2}
 .main{padding:14px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
 <symbol id="i-open" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
 <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></symbol>
 <symbol id="i-feat" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
 <symbol id="i-eye" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
 <symbol id="i-share" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M14 14h2v2h-2zM18 18h2.5M14 19v1.5M18.5 14v2"/></symbol>
 <symbol id="i-call" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></symbol>
 <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
 <symbol id="i-line" viewBox="0 0 24 24"><path d="M4 11.5C4 7.4 7.6 4.5 12 4.5s8 2.9 8 7-3.6 7-8 7c-.8 0-1.6-.1-2.3-.3L6 20v-3.4C4.8 15.6 4 13.7 4 11.5z"/></symbol>
 <symbol id="i-voice" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></symbol>
 <symbol id="i-loc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
 <symbol id="i-form" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
 <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a1 1 0 01-1 1H7a1 1 0 01-1-1V4.5a1 1 0 011-1z"/><path d="M14 3.5V8h4M12 17v-5M9.8 14l2.2-2.2 2.2 2.2"/></symbol>
</defs></svg>

<div class="sys">
 <div class="top">
  <span class="shop">阿新快炒</span><span class="sub">智慧名片系統</span><span class="sp"></span>
  <span class="light" id="topLight" style="--c:var(--ok)"><i></i><span id="topTxt">營業中</span></span>
  <span class="clock" id="clock">--:--</span>
 </div>

 <nav class="rail" id="rail" aria-label="功能選單">
  <button data-p="home" aria-current="page"><svg><use href="#i-home"/></svg>首頁</button>
  <button data-p="open"><svg><use href="#i-open"/></svg>營業</button>
  <button data-p="menu"><svg><use href="#i-menu"/></svg>菜單</button>
  <button data-p="feat"><svg><use href="#i-feat"/></svg>功能</button>
  <button data-p="prev" id="prevBtn"><svg><use href="#i-eye"/></svg>預覽</button>
 </nav>

 <main class="main" id="mainEl">
  <!-- 首頁 -->
  <section class="page on" id="p-home">
   <h1>首頁</h1>
   <div class="grid">
    <button class="tile stat wide" data-go="open" id="hStat" style="--c:var(--ok)">
     <svg class="ic"><use href="#i-open"/></svg>
     <div><div class="big"><i></i><span id="hStatTxt">營業中</span></div><small id="hStatSub">今天 17:00 – 23:30　點這裡改</small></div>
    </button>
    <button class="tile" data-go="menu"><svg class="ic"><use href="#i-menu"/></svg><div><b>菜單</b><small id="hMenu">0 項售完</small></div></button>
    <button class="tile" data-go="feat"><svg class="ic"><use href="#i-feat"/></svg><div><b>名片功能</b><small id="hFeat">3 個開啟</small></div></button>
    <button class="tile" data-go="share"><svg class="ic"><use href="#i-share"/></svg><div><b>QR 與連結</b><small>貼在店門口</small></div></button>
    <button class="tile" data-go="prev"><svg class="ic"><use href="#i-eye"/></svg><div><b>客人看到的</b><small>即時預覽</small></div></button>
   </div>
  </section>

  <!-- 營業 -->
  <section class="page" id="p-open">
   <h1>今天營業嗎</h1>
   <div class="choice" id="status">
    <button data-s="ok" style="--c:var(--ok)"><i></i>營業中<small>照平常時間</small></button>
    <button data-s="early" style="--c:var(--warn)"><i></i>提早打烊<small id="earlyTxt">今天 20:00</small></button>
    <button data-s="rest" style="--c:var(--rest)"><i></i>今天休息<small>客人看到紅燈</small></button>
   </div>
   <div class="box">
    <div class="row" id="earlyRow" hidden><div class="l"><b>今天打烊時間</b></div><input type="time" id="earlyT" value="20:00"></div>
    <div class="row"><div class="l"><b>平常營業時間</b><small>設定一次，平常日子不用再動</small></div><div class="hours"><input type="time" id="o1" value="17:00"><span>–</span><input type="time" id="o2" value="23:30"></div></div>
    <div class="row"><div class="l"><b>每週固定休息</b></div><button class="pill" id="dow" aria-pressed="false">每週一休</button></div>
   </div>
  </section>

  <!-- 菜單 -->
  <section class="page" id="p-menu">
   <h1>菜單</h1>
   <p class="hint">按「售完」，客人那邊馬上劃掉。</p>
   <div class="box menu" id="menu"></div>
  </section>

  <!-- 功能 -->
  <section class="page" id="p-feat">
   <h1>名片要顯示哪些功能</h1>
   <p class="hint">點一下開關。沒打開的，客人那邊就不會出現。</p>
   <div class="feat" id="mods"></div>
  </section>

  <!-- QR 與連結 -->
  <section class="page" id="p-share">
   <h1>QR 與連結</h1>
   <div class="box"><div class="row link"><div class="l"><b>客人掃的名片連結</b><small>印成 QR 貼在店門口、菜單、名片上</small></div><code>kitlab.store/c/axin</code></div>
   <div class="row link"><div class="l"><b>只有你知道的專屬連結</b><small>存到手機桌面，用來按營業狀態；不要給別人</small></div><code>kitlab.store/m/7fK2-x9Qa</code></div></div>
  </section>
 </main>

 <aside class="prev" id="prevPane">
  <div class="cap">客人掃 QR 看到的畫面</div>
  <div class="phone"><div class="screen" id="screen"></div></div>
 </aside>
</div>

<script>
var M=[
 {k:'call',n:'一鍵打電話',d:'客人點一下就撥給你',ic:'call',on:true},
 {k:'map',n:'地圖導航',d:'開地圖帶客人過來',ic:'map',on:true},
 {k:'menu',n:'菜單與價格',d:'顯示菜單',ic:'menu',on:true},
 {k:'line',n:'LINE 聯絡',d:'一鍵加你的 LINE',ic:'line',on:false},
 {k:'voice',n:'語音留言',d:'客人按住說話留言',ic:'voice',on:false},
 {k:'loc',n:'傳位置',d:'客人傳自己位置給你',ic:'loc',on:false},
 {k:'form',n:'填表單',d:'預約、訂位、詢問',ic:'form',on:false},
 {k:'file',n:'收檔案',d:'客人傳照片、文件',ic:'file',on:false}
];
var items=[{n:'蛋炒飯',p:70,s:false},{n:'三杯雞',p:280,s:false},{n:'炒青菜',p:100,s:false},{n:'蛤蜊湯',p:120,s:true}];
var st='ok',earlyT='20:00',closedMon=false;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ico(n){return '<svg class="ic"><use href="#i-'+n+'"/></svg>'}

function go(p){
 var pv=p==='prev';
 document.body.classList.toggle('showprev',pv);
 var page=pv?null:p;
 [].forEach.call(document.querySelectorAll('.page'),function(x){x.classList.toggle('on',x.id==='p-'+page)});
 [].forEach.call(document.querySelectorAll('#rail button'),function(b){var m=b.dataset.p===p||(p==='share'&&b.dataset.p==='home');if(m)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('p-home').classList.toggle('on',p==='home');
 $('mainEl').scrollTop=0;
}
$('rail').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.p)};
document.querySelector('.main').onclick=function(e){var t=e.target.closest('[data-go]');if(t)go(t.dataset.go)};

function drawMods(){
 $('mods').innerHTML=M.map(function(m,i){return '<button role="switch" aria-checked="'+m.on+'" data-i="'+i+'"><span class="st">'+(m.on?'已開':'關')+'</span>'+ico(m.ic)+'<span><b>'+m.n+'</b><small>'+m.d+'</small></span></button>'}).join('');
}
function drawMenu(){
 $('menu').innerHTML=items.map(function(it,i){return '<div class="it"><input type="text" value="'+esc(it.n)+'" data-i="'+i+'" data-f="n" aria-label="品名"><input type="number" value="'+it.p+'" min="0" data-i="'+i+'" data-f="p" aria-label="價格"><button class="pill sold" aria-pressed="'+it.s+'" data-i="'+i+'">售完</button></div>'}).join('');
}
function info(){
 var o1=$('o1').value,o2=$('o2').value;
 if(st==='rest')return{cls:'rest',label:'今天休息',txt:'明天再來看看',c:'var(--rest)'};
 if(st==='early')return{cls:'early',label:'提早打烊',txt:'今天營業到 '+earlyT,c:'var(--warn)'};
 if(closedMon&&new Date().getDay()===1)return{cls:'rest',label:'今天公休',txt:'每週一休息',c:'var(--rest)'};
 return{cls:'ok',label:'營業中',txt:'今天 '+o1+' – '+o2,c:'var(--ok)'};
}
function card(){
 var f=info();
 var on=function(k){return M.filter(function(m){return m.k===k})[0].on};
 var A={call:['打電話',''],map:['導航','alt'],line:['LINE 聯絡','alt'],voice:['語音留言','alt'],loc:['傳位置','alt'],form:['預約／詢問','alt'],file:['傳檔案','alt']};
 var acts=['call','map','line','voice','loc','form','file'].filter(on).map(function(k){return '<a href="#" class="'+A[k][1]+'" onclick="return false">'+A[k][0]+'</a>'}).join('');
 var menu=on('menu')?'<div class="p-sec"><h4>菜單</h4>'+items.map(function(it){return '<div class="p-it'+(it.s?' s':'')+'"><span>'+esc(it.n)+(it.s?'<em>今日售完</em>':'')+'</span><span>$'+esc(it.p)+'</span></div>'}).join('')+'</div>':'';
 $('screen').innerHTML='<div class="p-head"><h3>阿新快炒</h3><p>宜蘭・熱炒・近羅東火車站</p><div class="badge '+f.cls+'"><i></i>'+f.label+'</div><div class="p-hours">'+f.txt+'</div></div>'+(acts?'<div class="acts">'+acts+'</div>':'')+menu+'<div class="foot">KitLab 智慧名片</div>';
 $('topTxt').textContent=f.label;$('topLight').style.setProperty('--c',f.c);
 $('hStat').style.setProperty('--c',f.c);$('hStatTxt').textContent=f.label;$('hStatSub').textContent=f.txt+'　點這裡改';
 $('hMenu').textContent=items.filter(function(i){return i.s}).length+' 項售完';
 $('hFeat').textContent=M.filter(function(m){return m.on}).length+' 個開啟';
}
function sync(){
 [].forEach.call(document.querySelectorAll('#status button'),function(b){b.setAttribute('aria-pressed',b.dataset.s===st)});
 $('earlyRow').hidden=st!=='early';$('earlyTxt').textContent='今天 '+earlyT;
 $('dow').setAttribute('aria-pressed',closedMon);card();
}
$('status').onclick=function(e){var b=e.target.closest('button');if(!b)return;st=b.dataset.s;sync()};
$('earlyT').oninput=function(){earlyT=this.value;sync()};
$('o1').oninput=$('o2').oninput=card;
$('dow').onclick=function(){closedMon=!closedMon;sync()};
$('mods').onclick=function(e){var b=e.target.closest('button');if(!b)return;var m=M[b.dataset.i];m.on=!m.on;b.setAttribute('aria-checked',m.on);b.querySelector('.st').textContent=m.on?'已開':'關';card()};
$('menu').onclick=function(e){var b=e.target.closest('.sold');if(!b)return;var it=items[b.dataset.i];it.s=!it.s;b.setAttribute('aria-pressed',it.s);card()};
$('menu').oninput=function(e){var t=e.target,it=items[t.dataset.i];if(!it)return;it[t.dataset.f]=t.dataset.f==='p'?(t.value||0):t.value;card()};
function tick(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
drawMods();drawMenu();sync();
</script>
</body>
